[workspace]
members = ["crates/bakon-core", "crates/bakon-cli", "crates/bakon"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/RobiNexy/Bakon"

[workspace.dependencies]
bakon-core = { path = "crates/bakon-core" }
bakon-cli = { path = "crates/bakon-cli" }
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"
