name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rustfmt check
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets

  rust-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - name: cargo check
        run: cargo check --workspace --target ${{ matrix.target }}

  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build -p bakon
      - name: version
        shell: bash
        run: ./target/debug/bakon version
      - name: init and verify
        shell: bash
        run: |
          ./target/debug/bakon --store ./ci-store init
          ./target/debug/bakon --store ./ci-store init
          ./target/debug/bakon --store ./ci-store verify
      - name: edit and revert on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          printf 'one\n' > note.txt
          printf '@echo off\r\necho two> "%%1"\r\n' > editor.bat
          export EDITOR="$(cygpath -w "$PWD/editor.bat")"
          ./target/debug/bakon --store ./ci-store edit ./note.txt
          ./target/debug/bakon --store ./ci-store log ./note.txt
          ./target/debug/bakon --store ./ci-store revert ./note.txt 0
          test "$(cat note.txt)" = "one"

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build all platforms
        run: scripts/build.sh
      - name: verify Termux arm64 artifact
        run: test -n "$(find dist -maxdepth 1 -name '*_termux-arm64.tar.gz' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
